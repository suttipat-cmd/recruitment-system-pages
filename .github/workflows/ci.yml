name: Verify Recruitment System
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: https://ci-fixture.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_fixture_not_a_live_key
      - run: npm test
